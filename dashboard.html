<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100vh;
      font-family: 'Segoe UI', sans-serif;
      color: white;
      background: #0d1b2a; /* Darker background for contrast */
      display: flex;
      flex-direction: column;
    }

    .header {
      padding: 20px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background-color: rgba(13, 27, 42, 0.8);
    }

    .welcome {
      font-size: 1.2rem;
    }

    .logout-btn {
      background: #ff4d4d;
      color: white;
      padding: 8px 16px;
      border: none;
      border-radius: 5px;
      text-decoration: none;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.3s;
    }

    .logout-btn:hover {
      background: #e60000;
    }

    .main-heading {
      text-align: center;
      font-size: 2.8rem;
      margin: 30px 0 10px;
      font-weight: 600;
    }

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 40px 30px; /* vertical and horizontal spacing */
      padding: 30px 60px;
      flex: 1;
    }

    .feature-box {
      background: #1e90ff; /* Light Blue Boxes */
      padding: 40px 20px;
      border-radius: 12px;
      text-align: center;
      text-decoration: none;
      color: white;
      font-size: 1.4rem;
      font-weight: 500;
      transition: transform 0.3s, background 0.3s;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .feature-box:hover {
      transform: translateY(-6px);
      background: #1c86ee;
    }

    .footer {
      padding: 15px;
      text-align: center;
      background: rgba(13, 27, 42, 0.8);
      font-size: 0.9rem;
    }

    @media (max-width: 992px) {
      .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .main-heading {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="welcome">Welcome, user@example.com</div>
    <a href="#" onclick="logout()" class="logout-btn">Logout</a>
  </div>

  <h1 class="main-heading">AI-Powered Solutions Hub</h1>

  <div class="dashboard-grid">
    <a href="chatbot.html" class="feature-box">🧠<br>AI Chatbot</a>
    <a href="summarizer.html" class="feature-box">📄<br>Text Summarizer</a>
    <a href="content.html" class="feature-box">✍️<br>Content Generator</a>
    <a href="image.html" class="feature-box">🎨<br>Image Generator</a>
    <a href="notes.html" class="feature-box">📝<br>Notes</a>
    <a href="Translator.html" class="feature-box">🌐<br>AI Translator</a>
  </div>

  <div class="footer">© 2025 AI-Powered Solutions Hub</div>
  <script src="auth.js"></script>
</body>
</html>
