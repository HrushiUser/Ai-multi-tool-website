<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <style>
    html, body { margin: 0; height: 100%; color: white; }
    body { background: url('/img.png') no-repeat center center fixed; background-size: cover; }
    div { position: absolute; right: 150px; top: 50%; transform: translateY(-50%); font-size: 1.4rem; }
    input { display: block; margin-bottom: 10px; background: black; color: white; font-size: 1.2rem; }
    button { background: #00b7eb; color: white; }
  </style>
</head>
<body>
  <div>
    <h2>Login</h2>
    <form method="POST" action="/login">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Login</button>
    </form>
    <p>Don't have an account? <a href="signup.html" style="color: white;">Sign Up</a></p>
  </div>
  <script src="auth.js"></script>
</body>
</html>
