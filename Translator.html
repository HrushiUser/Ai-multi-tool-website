<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>🌐 AI Indian Language Translator</title>
  <style>
    body {
      background-color: #142850;
      color: #dbe9ff;
      font-family: Arial, sans-serif;
      padding: 40px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      margin: 0;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 2.5rem;
      color: #bbe1fa;
      user-select: none;
    }
    textarea {
      width: 100%;
      max-width: 600px;
      height: 150px;
      margin-bottom: 20px;
      padding: 10px;
      font-size: 1rem;
      background-color: #000000;
      color: #dbe9ff;
      border: 2px solid #1e90ff;
      border-radius: 6px;
      resize: vertical;
      font-family: inherit;
    }
    select, button {
      font-size: 1rem;
      padding: 10px;
      margin: 10px 5px 20px 5px;
      border-radius: 6px;
      border: none;
      cursor: pointer;
    }
    select {
      background: #1e90ff;
      color: white;
      border: 2px solid #1e90ff;
    }
    button {
      background: #1e90ff;
      color: white;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #3ea0ff;
    }
    .output {
      margin-top: 20px;
      padding: 15px;
      background: #0a0a0a;
      border-radius: 10px;
      color: #dbe9ff;
      max-width: 600px;
      min-height: 75px;
      white-space: pre-wrap;
      user-select: text;
      width: 100%;
    }
    .controls {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      max-width: 600px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>🌐 AI Translator</h1>
  <textarea id="inputText" placeholder="Type text to translate..."></textarea>
  <div class="controls">
    <select id="sourceLang">
      <option value="hi">Hindi</option>
      <option value="en">English</option>
      <option value="bn">Bengali</option>
      <option value="te">Telugu</option>
      <option value="mr">Marathi</option>
      <option value="ta">Tamil</option>
      <option value="gu">Gujarati</option>
      <option value="kn">Kannada</option>
      <option value="ml">Malayalam</option>
      <option value="or">Odia</option>
      <option value="pa">Punjabi</option>
      <option value="as">Assamese</option>
    </select>
    <select id="targetLang">
      <option value="en">English</option>
      <option value="hi" selected>Hindi</option>
      <option value="bn">Bengali</option>
      <option value="te">Telugu</option>
      <option value="mr">Marathi</option>
      <option value="ta">Tamil</option>
      <option value="gu">Gujarati</option>
      <option value="kn">Kannada</option>
      <option value="ml">Malayalam</option>
      <option value="or">Odia</option>
      <option value="pa">Punjabi</option>
      <option value="as">Assamese</option>
    </select>
    <button id="translateBtn">Translate</button>
  </div>
  <div class="output" id="translatedText">Translation will appear here...</div>
  <script>
    document.getElementById('translateBtn').addEventListener('click', () => {
      const text = document.getElementById('inputText').value.trim();
      const source = document.getElementById('sourceLang').value;
      const target = document.getElementById('targetLang').value;
      const output = document.getElementById('translatedText');
      if (!text) {
        output.textContent = "Please enter text to translate.";
        return;
      }
      output.textContent = "Translating...";
      fetch(`https://api.mymemory.translated.net/get?q=${encodeURIComponent(text)}&langpair=${source}|${target}`, {
        method: 'GET'
      })
      .then(response => response.json())
      .then(data => {
        console.log("API Response:", data); // Debugging: Check response in DevTools Console
        if (data.responseData && data.responseData.translatedText) {
          output.textContent = data.responseData.translatedText;
        } else {
          output.textContent = "Translation failed. Please try again.";
        }
      })
      .catch(error => {
        console.error("Translation error:", error);
        output.textContent = "Error connecting to translation service.";
      });
    });
  </script>
</body>
</html>
