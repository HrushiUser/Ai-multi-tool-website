<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign Up</title>
  <style>
    html, body { 
      margin: 0;
      height: 100%;
      color: white; 
    }
    body { 
      background: url('/img.png') no-repeat center center fixed; 
      background-size: cover;
    }
    div { 
      position: absolute;
      right: 150px; 
      top: 50%;
      transform: translateY(-50%);
      font-size: 1.4rem; 
    }
    input { 
      display: block;
      margin-bottom: 10px;
      background: black;
      color: white; 
      font-size: 1.2rem;
    }
    button { 
      background: #00b7eb;
      color: white; 
    }
  </style>
</head>
<body>
  <div>
    <h2>Sign Up</h2>
    <form method="POST" action="/signup">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>
    <p>Already have an account? <a href="login.html" style="color: white;">Login</a></p>
  </div>
  <script src="auth.js"></script>
</body>
</html>
