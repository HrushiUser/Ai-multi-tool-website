<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Text Summarizer</title>
  <style>
    body {
      background-color: #142850;  
      color: #dbe9ff;             
      font-family: Arial, sans-serif;
      padding: 40px;
    }
    textarea {
      width: 100%;
      height: 350px;
      margin-bottom: 20px;
      padding: 10px;
      font-size: 1rem;
      background-color: #000000;  
      color: #dbe9ff;
      border: 2px solid #1e90ff; 
      border-radius: 6px;
      resize: vertical;
      font-family: inherit;
    }
    button {
      padding: 10px 20px;
      font-size: 1rem;
      background: #1e90ff;        
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #3ea0ff;
    }
    .output {
      margin-top: 20px;
      padding: 20px;
      background: #1c86ee;        
      border-radius: 10px;
      color: white;
      min-height: 80px;
      white-space: pre-wrap;
      user-select: text;
    }
    h1 {
      margin-bottom: 30px;
      font-size: 2.5rem;
      color: #bbe1fa;
      user-select: none;
    }
    .error {
      color: #ff4c4c;
    }
  </style>
</head>
<body>
  <h1>📄 Text Summarizer</h1>
  <form id="summarizer-form">
    <textarea id="inputText" placeholder="Enter long text here..."></textarea>
    <button type="submit">Summarize</button>
  </form>
  <div class="output" id="summaryOutput"></div>
  <script>
    document.getElementById("summarizer-form").addEventListener("submit", async function (e) {
      e.preventDefault();
      const text = document.getElementById("inputText").value.trim();
      const output = document.getElementById("summaryOutput");
      const button = this.querySelector("button");
      if (!text) {
        output.textContent = "Please enter text to summarize.";
        output.className = "output error";
        return;
      }
      output.textContent = "Summarizing...";
      output.className = "output";
      button.disabled = true;
      try {
        const response = await fetch("https://api-inference.huggingface.co/models/facebook/bart-large-cnn", {
          method: "POST",
          headers: {
            "Authorization": "Bearer YOUR_API_KEY",  
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            inputs: text,
            parameters: {
              max_length: 250,  
              min_length: 150,
              do_sample: false,
              early_stopping: true
            }
          })
        });
        if (!response.ok) {
          throw new Error(`API error: ${response.status} ${response.statusText}`);
        }
        const data = await response.json();
        if (data.error) {
          throw new Error("API error: " + data.error);
        }
        const summary = data[0]?.summary_text || "No summary generated.";
        output.textContent = summary;
      } catch (error) {
        console.error(error);
        output.textContent = "Error connecting to summarization API. Please try again later.";
        output.className = "output error";
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
